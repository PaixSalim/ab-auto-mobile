name: Continuous Integration (CI)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, prod ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (Jest)
        run: npm run test

      - name: Build Backend (Dry Run)
        run: npm run build

      - name: Build Frontend (Dry Run)
        run: npx vite build
