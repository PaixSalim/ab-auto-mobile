name: Deploy NestJS Inertia to Hostinger

on:
  push:
    branches: [ prod ]  # Déploiement automatique lors d'un push sur 'prod'
  workflow_dispatch:      # Déclenchement manuel autorisé

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend (NestJS)
        run: npm run build

      - name: Build Frontend (Inertia/Vite)
        run: npx vite build

      - name: Prepare Deployment Directory
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r public deploy/
          cp -r views deploy/
          cp -r prisma deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp main.js deploy/
          mkdir -p deploy/tmp

      - name: Upload Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_AUTO_AB_SSH_KEY }}
          port: 65002
          source: "deploy/*"
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          strip_components: 1

      - name: SSH Post-Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_AUTO_AB_SSH_KEY }}
          port: 65002
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}
            
            # Installer uniquement les dépendances de production
            npm ci --omit=dev
            
            # Exécuter les migrations Prisma
            npx prisma migrate deploy
            
            # Redémarrer l'application (Passenger / Hostinger Node.js Selector)
            touch tmp/restart.txt
